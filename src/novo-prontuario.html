<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Prontuário | Hellsmile</title>
    <link href="../dist/output.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f4f8;
        }
        .form-input {
            background-color: white !important;
            border: 1px solid #cbd5e0 !important;
            resize: none;
        }
    </style>
    <script src="./utils/auth.js" type="module"></script>
    <style>
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .floating-label {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            transition: all 0.3s ease;
            pointer-events: none;
            color: #666;
        }
        .form-input:focus ~ .floating-label,
        .form-input:not(:placeholder-shown) ~ .floating-label {
            top: 0;
            transform: translateY(-100%) scale(0.9);
            background: white;
            padding: 0 0.5rem;
            color: #0070ba;
        }
        .form-input:focus {
            border-color: #0070ba;
            box-shadow: 0 0 0 2px rgba(0,112,186,0.2);
        }
        .file-preview {
            max-width: 100px;
            max-height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }
        .drag-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .drag-area.active {
            border-color: #0070ba;
            background-color: #f0f9ff;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-primary text-white p-6 space-y-6 relative">
            <nav class="space-y-3">
                <a href="dashboard.html" class="block hover:underline">🏠 Dashboard</a>
                <a href="pacientes.html" class="block hover:underline">👥 Pacientes</a>
                <a href="agenda.html" class="block hover:underline">📅 Agenda</a>
                <a href="prontuarios.html" class="block hover:underline font-bold underline">📄 Prontuários</a>
                <a href="odontograma.html" class="block hover:underline">🦷 Odontograma</a>
                <a href="financeiro.html" class="block hover:underline">💰 Financeiro</a>
                <a href="configuracoes.html" class="block hover:underline">⚙️ Configurações</a>
                <a href="index.html" class="block hover:underline">🚪 Sair</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <h1 class="text-3xl font-bold mb-6">Novo Prontuário</h1>

            <div class="bg-white rounded-xl shadow-lg p-6">
                <!-- Informações Básicas -->
                <section class="mb-8">
                    <h2 class="text-xl font-semibold mb-4">Informações do Paciente</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="input-group">
                            <input type="text" id="paciente-nome" 
                                   class="form-input w-full p-3 border rounded-xl transition-all duration-300 bg-white" 
                                  placeholder=" " required>
                            <label class="floating-label">Nome do Paciente</label>
                        </div>
                        <div class="input-group">
                            <input type="date" id="data-consulta" 
                                   class="form-input w-full p-3 border rounded-xl transition-all duration-300 bg-white" 
                                  required>
                            <label class="floating-label">Data da Consulta</label>
                        </div>
                        <div class="input-group">
                            <textarea id="observacoes" class="form-input w-full p-3 border rounded-xl transition-all duration-300 bg-white" 
                                   placeholder="Observações" rows="4" style="resize: none;"></textarea>
                        </div>
                    </div>
                </section>

                <!-- Upload de Arquivos -->
                <section class="mb-8">
                    <h2 class="text-xl font-semibold mb-4">Anexar Arquivos</h2>
                    <div class="drag-area flex flex-col items-center justify-center p-8 border-2 border-dashed border-gray-300 rounded-xl">
                        <input type="file" id="file-input" multiple class="hidden" accept="image/*,.pdf" onchange="handleFiles(event)">
                        <button onclick="document.getElementById('file-input').click()" 
                                class="bg-primary text-white px-6 py-3 text-sm rounded-lg hover:bg-blue-700 transition-colors">
                            Anexar Arquivos
                        </button>
                    </div>

                    <!-- Preview dos Arquivos -->
                    <div id="preview-container" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
                        <!-- Previews serão inseridos aqui -->
                    </div>
                </section>

                <!-- Botões de Ação -->
                <div class="flex justify-end space-x-4">
                    <button onclick="window.location.href='prontuarios.html'" class="px-4 py-2 border rounded-lg hover:bg-gray-50">Cancelar</button>
                    <button onclick="salvarProntuario()" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-700">
                        Salvar Prontuário
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function salvarProntuario() {
            try {
                const fileElements = document.querySelectorAll('.file-preview');
                const arquivos = [];

                // Convert images to Base64
                for (let img of fileElements) {
                    const base64Data = img.src;
                    arquivos.push({
                        nome: img.dataset.filename,
                        tipo: img.dataset.type,
                        dados: base64Data
                    });
                }

                const prontuario = {
                    id: Date.now().toString(),
                    paciente: document.getElementById('paciente-nome').value,
                    dataConsulta: document.getElementById('data-consulta').value,
                    observacoes: document.getElementById('observacoes').value,
                    arquivos: arquivos,
                    dataCriacao: new Date().toISOString()
                };

                // Validação básica
                if (!prontuario.paciente || !prontuario.dataConsulta) {
                    showErrorMessage('Por favor, preencha todos os campos obrigatórios.');
                    return;
                }

                const prontuarios = JSON.parse(localStorage.getItem('prontuarios')) || [];
                prontuarios.push(prontuario);
                localStorage.setItem('prontuarios', JSON.stringify(prontuarios));

                showSuccessMessage('Prontuário salvo com sucesso!');
                
                setTimeout(() => {
                    window.location.href = 'prontuarios.html';
                }, 1000);
            } catch (error) {
                console.error('Erro ao salvar prontuário:', error);
                showErrorMessage('Erro ao salvar prontuário. Tente novamente.');
            }
        }

        const dragArea = document.querySelector('.drag-area');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');

        // Previne o comportamento padrão de drag and drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dragArea.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Highlight drop zone quando item é arrastado sobre
        ['dragenter', 'dragover'].forEach(eventName => {
            dragArea.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dragArea.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dragArea.classList.add('active');
        }

        function unhighlight(e) {
            dragArea.classList.remove('active');
        }

        // Handle dropped files
        dragArea.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFiles, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles({ target: { files } });
        }

        function handleFiles(e) {
            e.stopPropagation();
            const files = Array.from(e.target.files);
            
            // Validate files
            const validFiles = files.filter(file => {
                const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'application/pdf'];
                const maxSize = 5 * 1024 * 1024; // 5MB
                if (!validTypes.includes(file.type)) {
                    showErrorMessage(`Tipo de arquivo não suportado: ${file.type}`);
                    return false;
                }
                if (file.size > maxSize) {
                    showErrorMessage(`Arquivo muito grande: ${file.name}`);
                    return false;
                }
                return true;
            });
            
            validFiles.forEach(previewFile);
            e.target.value = ''; // Clear input to prevent duplicate selections
        }

        function previewFile(file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onloadend = function() {
                const div = document.createElement('div');
                div.className = 'relative';
                
                const img = document.createElement('img');
                img.src = reader.result;
                img.className = 'file-preview rounded shadow w-24 h-24 object-cover';
                img.dataset.filename = file.name;
                img.dataset.type = file.type;
                
                const removeBtn = document.createElement('button');
                removeBtn.innerHTML = '×';
                removeBtn.className = 'absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center hover:bg-red-600';
                removeBtn.onclick = function() {
                    div.remove();
                };

                div.appendChild(img);
                div.appendChild(removeBtn);
                previewContainer.appendChild(div);
            }
        }

        function showSuccessMessage(message) {
            const alert = document.createElement('div');
            alert.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg animate__animated animate__fadeIn';
            alert.textContent = message;
            document.body.appendChild(alert);
            setTimeout(() => {
                alert.classList.add('animate__fadeOut');
                setTimeout(() => alert.remove(), 500);
            }, 3000);
        }

        function showErrorMessage(message) {
            const alert = document.createElement('div');
            alert.className = 'fixed top-4 right-4 bg-red-500 text-white px-6 py-3 rounded-lg animate__animated animate__fadeIn';
            alert.textContent = message;
            document.body.appendChild(alert);
            setTimeout(() => {
                alert.classList.add('animate__fadeOut');
                setTimeout(() => alert.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>

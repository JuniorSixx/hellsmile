<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Paciente | Hellsmile</title>
  <link rel="stylesheet" href="dist/output.css" />
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="flex min-h-screen justify-center items-center">
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md">
      <h2 class="text-2xl font-bold text-center mb-6">Cadastro de Paciente</h2>
      <form id="cadastro-form" onsubmit="handleSubmit(event)">
        <!-- Dados do paciente -->
        <input type="text" id="nome" placeholder="Nome Completo" class="w-full p-3 mb-4 border border-gray-300 rounded-md" required />
        <input type="email" id="email" placeholder="E-mail" class="w-full p-3 mb-4 border border-gray-300 rounded-md" required />
        <input type="tel" id="telefone" placeholder="Telefone" class="w-full p-3 mb-4 border border-gray-300 rounded-md" required />
        <input type="text" id="endereco" placeholder="Endereço" class="w-full p-3 mb-4 border border-gray-300 rounded-md" required />
        
        <!-- Dados médicos -->
        <input type="text" id="plano-saude" placeholder="Plano de Saúde" class="w-full p-3 mb-4 border border-gray-300 rounded-md" />
        <input type="text" id="num-senha" placeholder="Número da Senha (se aplicável)" class="w-full p-3 mb-4 border border-gray-300 rounded-md" />
        
        <!-- Senha para cadastro -->
        <input type="password" id="senha" placeholder="Senha" class="w-full p-3 mb-4 border border-gray-300 rounded-md" required />
        
        <button type="submit" class="w-full bg-primary text-white py-3 rounded-xl hover:brightness-110 transition ease-in-out duration-200">
          Criar Conta
        </button>
      </form>
      
      <div class="mt-4 text-center">
        <p>Já tem uma conta? <a href="index.html" class="text-blue-600">Faça login</a></p>
      </div>
    </div>
  </div>
  
  <script>
    function formatTelefone(telefone) {
      const cleaned = telefone.replace(/\D/g, '');
      const match = cleaned.match(/^(\d{2})(\d{5})(\d{4})$/);
      if (match) {
        return `(${match[1]}) ${match[2]}-${match[3]}`;
      }
      return telefone;
    }

    document.getElementById('telefone').addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length <= 11) {
        e.target.value = formatTelefone(value);
      }
    });

    function handleSubmit(event) {
      event.preventDefault();
      const formData = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        telefone: document.getElementById('telefone').value,
        endereco: document.getElementById('endereco').value,
        planoSaude: document.getElementById('plano-saude').value,
        numSenha: document.getElementById('num-senha').value,
        senha: document.getElementById('senha').value
      };
      
      const pacientes = JSON.parse(localStorage.getItem('pacientes')) || [];
      pacientes.push(formData);
      localStorage.setItem('pacientes', JSON.stringify(pacientes));
      
      window.location.href = 'obrigado.html';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado! - HellSmile</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .thank-you-container {
            min-height: 100vh;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .thank-you-box {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <div class="thank-you-box">
            <h1 class="text-3xl font-bold text-primary mb-4" style="color: #0070ba;">Obrigado!</h1>
            <p class="text-gray-600 mb-6">
                Recebemos sua solicitação para teste do HellSmile. 
                Em breve, nossa equipe entrará em contato com você!
            </p>
            <div class="mt-8">
                <a href="index.html" 
                   class="px-6 py-3 text-white rounded-lg hover:brightness-110 transition-all"
                   style="background-color: #0070ba;">
                    Voltar para a página inicial
                </a>
            </div>
        </div>
    </div>
</body>
</html>

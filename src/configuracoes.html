<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurações | HellSmile</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="output.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.11.2/toastify.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.11.2/toastify.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="flex min-h-screen">
        <aside class="sidebar fixed">
            <nav class="flex flex-col space-y-4">
                <a href="dashboard.html" class="nav-link">🏠 Dashboard</a>
                <a href="pacientes.html" class="nav-link">👥 Pacientes</a>
                <a href="agenda.html" class="nav-link">📅 Agenda</a>
                <a href="prontuarios.html" class="nav-link">📄 Prontuários</a>
                <a href="odontograma.html" class="nav-link">🦷 Odontograma</a>
                <a href="financeiro.html" class="nav-link">💰 Financeiro</a>
                <a href="configuracoes.html" class="nav-link font-bold underline">⚙️ Configurações</a>
                <div class="h-4"></div>
                <a href="index.html" class="nav-link">🚪 Sair</a>
            </nav>
        </aside>

        <main class="main-content">
            <h1 class="text-3xl font-bold mb-6">Configurações da Clínica</h1>

            <div class="space-y-4">
                <div>
                    <h2 class="text-xl font-bold mb-4">Informações da Clínica</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="clinica" class="block text-sm font-semibold text-gray-700">Nome da Clínica</label>
                            <input type="text" id="clinica" class="w-full px-4 py-2 border border-gray-300 rounded-xl">
                        </div>
                        <div>
                            <label for="cnpj" class="block text-sm font-semibold text-gray-700">CNPJ</label>
                            <input type="text" id="cnpj" class="w-full px-4 py-2 border border-gray-300 rounded-xl">
                        </div>
                        <div>
                            <label for="telefone" class="block text-sm font-semibold text-gray-700">Telefone</label>
                            <input type="tel" id="telefone" class="w-full px-4 py-2 border border-gray-300 rounded-xl">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-semibold text-gray-700">Email</label>
                            <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded-xl">
                        </div>
                    </div>
                </div>

                <button onclick="salvarConfiguracoes()" class="bg-primary text-white px-4 py-2 rounded-xl shadow hover:brightness-110">
                    Atualizar Configurações
                </button>
            </div>
            
            <script>
                function salvarConfiguracoes() {
                    const config = {
                        clinica: document.getElementById('clinica').value,
                        cnpj: document.getElementById('cnpj').value,
                        telefone: document.getElementById('telefone').value,
                        email: document.getElementById('email').value
                    };
                    
                    localStorage.setItem('configuracoes', JSON.stringify(config));
                    
                    Toastify({
                        text: "Configurações salvas com sucesso!",
                        duration: 3000,
                        gravity: "top",
                        position: "right",
                        backgroundColor: "#10B981",
                    }).showToast();
                }
            </script>
        </main>
    </div>
</body>
</html>

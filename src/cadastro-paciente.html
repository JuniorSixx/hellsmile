<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar Paciente | Hellsmile</title>
  <link rel="stylesheet" href="../dist/output.css" />
</head>
<body class="bg-gray-50 text-gray-800">

  <div class="max-w-3xl mx-auto mt-12 bg-white p-8 rounded-2xl shadow">
    <h1 class="text-3xl font-bold mb-6 text-primary">Cadastrar Paciente</h1>

    <form class="space-y-6" id="cadastroPacienteForm" onsubmit="handleSubmit(event)">
      <div>
        <label class="block mb-1 font-medium">Nome completo</label>
        <input type="text" class="w-full border border-gray-300 rounded-xl px-4 py-2" name="name" required />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block mb-1 font-medium">Telefone</label>
          <input type="tel" class="w-full border border-gray-300 rounded-xl px-4 py-2" name="phone" required />
        </div>
        <div>
          <label class="block mb-1 font-medium">Email</label>
          <input type="email" class="w-full border border-gray-300 rounded-xl px-4 py-2" name="email" />
        </div>
      </div>

      <div>
        <label class="block mb-1 font-medium">Endereço</label>
        <input type="text" class="w-full border border-gray-300 rounded-xl px-4 py-2" name="address" />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div>
          <label class="block mb-1 font-medium">Data de Nascimento</label>
          <input type="date" class="w-full border border-gray-300 rounded-xl px-4 py-2" name="birthDate" />
        </div>
        <div>
          <label class="block mb-1 font-medium">CPF</label>
          <input type="text" class="w-full border border-gray-300 rounded-xl px-4 py-2" name="cpf" />
        </div>
        <div>
          <label class="block mb-1 font-medium">Convênio</label>
          <input type="text" class="w-full border border-gray-300 rounded-xl px-4 py-2" name="insurance" />
        </div>
      </div>

      <div class="flex justify-end space-x-4 pt-4">
        <a href="./pacientes.html" class="px-4 py-2 rounded-xl border text-gray-600 hover:bg-gray-100">Cancelar</a>
        <button type="submit" class="bg-primary text-white px-6 py-2 rounded-xl shadow hover:brightness-110">
          Salvar
        </button>
      </div>
    </form>
  </div>

  <script>
    function handleSubmit(event) {
      event.preventDefault();
      
      const formData = {
        nome: event.target.name.value,
        telefone: event.target.phone.value,
        email: event.target.email.value,
        endereco: event.target.address.value,
        dataNascimento: event.target.birthDate.value,
        cpf: event.target.cpf.value,
        convenio: event.target.insurance.value,
        dataCadastro: new Date().toISOString(),
        status: 'Ativo'
      };

      // Recupera a lista atual de pacientes ou cria uma nova
      const pacientes = JSON.parse(localStorage.getItem('pacientes')) || [];
      
      // Adiciona o novo paciente
      pacientes.push(formData);
      
      // Salva a lista atualizada
      localStorage.setItem('pacientes', JSON.stringify(pacientes));
      
      // Mostra mensagem de sucesso
      alert('Paciente cadastrado com sucesso!');
      
      // Redireciona usando caminho relativo
      window.location.href = './pacientes.html';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | HellSmile</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="flex min-h-screen">
        <aside class="sidebar">
            <nav class="flex flex-col space-y-4">
                <a href="dashboard.html" class="nav-link">
                    🏠 Dashboard
                </a>
                <a href="pacientes.html" class="nav-link">
                    👥 Pacientes
                </a>
                <a href="agenda.html" class="nav-link font-bold underline">
                    📅 Agenda
                </a>
                <a href="prontuarios.html" class="nav-link">
                    📄 Prontuários
                </a>
                <a href="odontograma.html" class="nav-link">
                    🦷 Odontograma
                </a>
                <a href="financeiro.html" class="nav-link">
                    💰 Financeiro
                </a>
                <a href="configuracoes.html" class="nav-link">
                    ⚙️ Configurações
                </a>
                <div class="h-4"></div>
                <a href="index.html" class="nav-link">
                    🚪 Sair
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <h1 class="text-3xl font-bold mb-6">Agenda de Consultas</h1>

            <div class="flex gap-4 mb-6">
                <div class="flex-1">
                    <label for="data" class="block text-sm font-medium text-gray-700">Data</label>
                    <input type="date" id="data" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                </div>
                <div class="flex-1">
                    <label for="status" class="block text-sm font-medium text-gray-700">Status</label>
                    <select id="status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                        <option value="agendado">Agendado</option>
                        <option value="em-andamento">Em andamento</option>
                        <option value="concluido">Concluído</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button class="bg-primary text-white px-4 py-2 rounded-lg shadow hover:brightness-110">
                        Filtrar
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full bg-white rounded-lg shadow-lg text-sm">
                    <thead class="bg-gray-100 text-left">
                        <tr>
                            <th class="px-6 py-3 text-xs font-medium text-gray-500 uppercase">Paciente</th>
                            <th class="px-6 py-3 text-xs font-medium text-gray-500 uppercase">Data</th>
                            <th class="px-6 py-3 text-xs font-medium text-gray-500 uppercase">Procedimento</th>
                            <th class="px-6 py-3 text-xs font-medium text-gray-500 uppercase">Status</th>
                            <th class="px-6 py-3 text-xs font-medium text-gray-500 uppercase">WhatsApp</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr class="border-t hover:bg-gray-50" data-phone="5511999999999">
                            <td class="px-6 py-4">Naruto Uzumaki</td>
                            <td class="px-6 py-4">08/04/2025</td>
                            <td class="px-6 py-4">Limpeza</td>
                            <td class="px-6 py-4">
                                <span class="status-badge bg-green-500 text-white rounded-lg px-2 py-1">Concluído</span>
                            </td>
                            <td class="px-6 py-4">
                                <button onclick="sendWhatsAppReminder(this)" class="text-blue-600 hover:underline">Enviar Lembrete</button>
                            </td>
                        </tr>
                        <tr class="border-t hover:bg-gray-50" data-phone="5511999999998">
                            <td class="px-6 py-4">Goku Son</td>
                            <td class="px-6 py-4">08/04/2025</td>
                            <td class="px-6 py-4">Canal</td>
                            <td class="px-6 py-4">
                                <span class="status-badge bg-yellow-500 text-white rounded-lg px-2 py-1">Em andamento</span>
                            </td>
                            <td class="px-6 py-4">
                                <button onclick="sendWhatsAppReminder(this)" class="text-blue-600 hover:underline">Enviar Lembrete</button>
                            </td>
                        </tr>
                        <tr class="border-t hover:bg-gray-50" data-phone="5511999999997">
                            <td class="px-6 py-4">Sakura Haruno</td>
                            <td class="px-6 py-4">08/04/2025</td>
                            <td class="px-6 py-4">Consulta inicial</td>
                            <td class="px-6 py-4">
                                <span class="status-badge bg-blue-500 text-white rounded-lg px-2 py-1">Agendado</span>
                            </td>
                            <td class="px-6 py-4">
                                <button onclick="sendWhatsAppReminder(this)" class="text-blue-600 hover:underline">Enviar Lembrete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        import whatsAppService from './utils/whatsappService.js';

        window.sendWhatsAppReminder = async function(button) {
            const row = button.closest('tr');
            const phoneNumber = row.dataset.phone || '5511999999999'; // Default for demo
            const appointmentDetails = {
                date: row.cells[1].textContent,
                time: '14:00', // Example time
            };

            try {
                await whatsAppService.sendReminderMessage(phoneNumber, appointmentDetails);
                alert('Lembrete enviado com sucesso!');
            } catch (error) {
                alert('Erro ao enviar lembrete via WhatsApp');
            }
        };
    </script>
</body>
</html>
